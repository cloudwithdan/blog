map $http_x_forwarded_proto $reject_direct {
    default 0;
    "" 1;
}

map $http_user_agent $is_kube_probe {
    default 0;
    "~*kube-probe" 1;
}

server {
    listen 8080;
    server_name _;
    index index.html;

    set $block "";
    if ($reject_direct) {
        set $block R;
    }
    if ($is_kube_probe) {
        set $block "";
    }
    if ($block = R) {
        return 444;
    }

    # Health check endpoint for kube-probe
    location = / {
        return 200 "OK";
    }

    location = /posts {
        return 301 https://$http_x_forwarded_host/posts/;
    }

    location /posts/ {
        alias /usr/share/nginx/html/;
        absolute_redirect off;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;
}